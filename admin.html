<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#f1f1f1]">
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-[28px] p-8 w-full max-w-sm shadow-xl text-center">
    <div class="w-14 h-14 bg-black text-white rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa fa-lock"></i></div>
    <h1 class="font-black text-xl">ADMIN</h1><p class="text-[10px] opacity-60">Administrador</p>
    <input id="pass" type="password" placeholder="Clave:" class="w-full border-2 rounded-full px-4 py-3.5 text-sm mt-6 outline-none focus:border-black">
    <button onclick="entrar()" class="w-full bg-black text-white rounded-full py-3.5 text-sm font-bold mt-3">Entrar</button>
    <p id="errLogin" class="text-xs text-red-600 mt-2 hidden">Clave incorrecta</p>
  </div>
</div>
<div id="panel" class="hidden">
  <div class="bg-white border-b sticky top-0 z-30 p-3 flex justify-between items-center">
    <div><b class="text-xs">ADMINISTRADOR DE EMPLEADAS CALI</b><p id="topStats" class="text-[10px] opacity-60">Cargando...</p></div>
    <div class="flex gap-2">
      <button onclick="borrarTodoSinRastro()" class="bg-red-600 text-white px-3 py-2 rounded-full text-[9px] font-bold">⚠️ BORRAR TODO</button>
      <a href="index.html" target="_blank" class="border px-3 py-2 rounded-full text-[10px]">Web</a>
      <button onclick="location.reload()" class="bg-black text-white px-3 py-2 rounded-full text-[10px]">Salir</button>
    </div>
  </div>
  <div class="flex gap-2 p-3 overflow-auto">
    <button onclick="tab('empleadas')" id="t-empleadas" class="tab bg-black text-white px-5 py-2.5 rounded-full text-xs font-bold">Empleadas</button>
    <button onclick="tab('clientes')" id="t-clientes" class="tab bg-white px-5 py-2.5 rounded-full text-xs font-bold">Clientes</button>
    <button onclick="tab('agenda')" id="t-agenda" class="tab bg-white px-5 py-2.5 rounded-full text-xs font-bold">Agenda</button>
    <button onclick="tab('pagos')" id="t-pagos" class="tab bg-white px-5 py-2.5 rounded-full text-xs font-bold">Ganancia</button>
  </div>
  <div class="max-w-[1400px] mx-auto p-3">
    <div id="v-empleadas" class="view grid lg:grid-cols-[380px_1fr] gap-4">
      <div class="bg-white rounded-[24px] p-5 h-fit lg:sticky lg:top-[110px] shadow-sm">
        <h2 id="formTitle" class="font-black text-sm">Nueva empleada</h2>
        <div class="grid gap-2.5 mt-4">
          <input id="aNombre" placeholder="Nombre completo *" class="border-2 rounded-full px-4 py-3 text-xs outline-none focus:border-black">
          <input id="aTelefono" placeholder="WhatsApp 300..." class="border-2 rounded-full px-4 py-3 text-xs">
          <input id="aEdad" placeholder="Edad" type="number" class="border-2 rounded-full px-4 py-3 text-xs">
          <div class="grid grid-cols-2 gap-2"><select id="aComuna" class="border-2 rounded-full px-3 py-3 text-xs bg-white"></select><select id="aBarrio" class="border-2 rounded-full px-3 py-3 text-xs bg-white"><option>Barrio *</option></select></div>
          <select id="aEstrato" class="border-2 rounded-full px-3 py-3 text-xs bg-white w-full"><option value="">Estrato</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
          <div class="grid grid-cols-3 gap-2"><div><label class="text-[9px] opacity-60">Pago interno</label><input id="aPagoDia" type="number" placeholder="85000" class="w-full border-2 rounded-full px-3 py-2.5 text-xs"></div><div><label class="text-[9px] opacity-60">Cobras cliente</label><input id="aCobroDia" type="number" placeholder="110000" class="w-full border-2 rounded-full px-3 py-2.5 text-xs"></div><div><label class="text-[9px] opacity-60">Web</label><input id="aPagoPublico" type="number" placeholder="90000" class="w-full border-2 rounded-full px-3 py-2.5 text-xs"></div></div>
          <input id="aFotoFile" type="file" accept="image/*" class="text-[10px]"><div id="skillsBox" class="flex flex-wrap gap-1.5 mt-2"></div><select id="aEstado" class="border-2 rounded-full px-3 py-3 text-xs bg-white"><option>Disponible</option><option>Urgente Hoy</option><option>En prueba 3 días</option><option>Ocupada</option></select>
        </div>
        <div class="flex gap-2 mt-5"><button id="btnGuardar" onclick="guardar()" class="flex-1 bg-black text-white rounded-full py-3 text-xs font-bold">Guardar</button><button onclick="limpiar()" class="border-2 px-5 rounded-full text-xs font-bold">Limpiar</button></div>
      </div>
      <div><div class="bg-white rounded-2xl p-2 flex gap-2 mb-3 shadow-sm"><input id="buscE" oninput="renderEmp()" placeholder="🔍 Buscar..." class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-xs outline-none"><span id="countEmp" class="text-xs py-2.5 px-2 font-bold">0</span></div><div id="listaEmp" class="grid sm:grid-cols-2 gap-3"></div></div>
    </div>
    <div id="v-clientes" class="view hidden">
      <div class="bg-white rounded-[20px] p-4 shadow-sm"><div class="flex flex-wrap justify-between gap-3 items-center"><div><h2 class="font-black text-sm">CLIENTES CRM</h2><p id="statsClientes" class="text-[10px] opacity-60">0 clientes</p></div><div class="flex gap-2"><input id="buscCli" oninput="renderCli()" placeholder="🔍 Buscar..." class="bg-gray-100 rounded-full px-4 py-2.5 text-xs outline-none w-[200px]"><button onclick="openModalCliente()" class="bg-black text-white px-5 py-2.5 rounded-full text-xs font-bold">+ Nuevo</button></div></div></div>
      <div id="listaCli" class="grid md:grid-cols-2 lg:grid-cols-3 gap-3 mt-4"></div>
    </div>
    <div id="v-agenda" class="view hidden">
      <div class="bg-white rounded-[20px] p-4 shadow-sm"><h3 class="font-bold text-xs mb-3">NUEVO SERVICIO</h3><div class="grid md:grid-cols-3 gap-3"><div><label class="text-[10px] opacity-60">Fecha</label><input id="agFecha" type="date" class="w-full border-2 rounded-full px-3 py-2.5 text-xs mt-1"></div><div><label class="text-[10px] opacity-60">Empleada</label><select id="agEmp" class="w-full border-2 rounded-full px-3 py-2.5 text-xs mt-1 bg-white"></select></div><div><label class="text-[10px] opacity-60">Cliente</label><select id="agCli" class="w-full border-2 rounded-full px-3 py-2.5 text-xs mt-1 bg-white"></select></div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3"><div><label class="text-[10px] opacity-60">Entrada</label><input id="agEnt" type="time" value="07:00" class="w-full border-2 rounded-full px-3 py-2.5 text-xs mt-1"></div><div><label class="text-[10px] opacity-60">Salida</label><input id="agSal" type="time" value="16:00" class="w-full border-2 rounded-full px-3 py-2.5 text-xs mt-1"></div><div class="bg-gray-100 rounded-2xl p-2 text-center"><p class="text-[9px] opacity-60">HORAS</p><b id="calcHoras" class="text-sm">8.0h</b></div><div class="bg-green-50 rounded-2xl p-2 text-center"><p class="text-[9px] opacity-60">GANANCIA</p><b id="calcGan" class="text-sm text-green-600">$25.000</b></div></div><button onclick="saveAgenda()" class="w-full bg-black text-white rounded-full py-3.5 text-xs font-bold mt-4">+ Agendar</button></div>
      <div id="listaAge" class="mt-4 grid gap-2"></div>
    </div>
    <div id="v-pagos" class="view hidden">
      <div class="bg-white rounded-[20px] p-5 shadow-sm"><div class="flex justify-between items-center flex-wrap gap-2"><h2 class="font-black text-sm">REPORTE</h2><div class="flex gap-2"><input id="mesP" type="month" onchange="renderPagos()" class="border-2 rounded-full px-3 py-1.5 text-xs"><button onclick="exportar()" class="bg-green-600 text-white px-4 py-1.5 rounded-full text-xs font-bold">Excel</button></div></div><div class="grid grid-cols-4 gap-2 mt-5 text-center"><div class="bg-gray-50 p-3 rounded-2xl"><p class="text-[9px] opacity-60">PAGADO</p><b id="pPag" class="text-sm">$0</b></div><div class="bg-gray-50 p-3 rounded-2xl"><p class="text-[9px] opacity-60">COBRADO</p><b id="pCob" class="text-sm">$0</b></div><div class="bg-green-50 p-3 rounded-2xl"><p class="text-[9px] opacity-60">GANANCIA</p><b id="pGan" class="text-sm text-green-600">$0</b></div><div class="bg-yellow-50 p-3 rounded-2xl"><p class="text-[9px] opacity-60">YA COBRADO</p><b id="pPre" class="text-sm">$0</b></div></div><p id="pFalta" class="text-[11px] mt-3 font-bold text-red-600"></p></div>
      <div id="listaPag" class="mt-4 grid gap-2"></div>
    </div>
  </div>
</div>
<div id="modalCliente" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-[24px] p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-4"><h2 id="titleCli" class="font-black text-sm">Nuevo Cliente</h2><button onclick="closeModalCliente()" class="w-8 h-8 bg-gray-100 rounded-full text-xs">✕</button></div>
    <div class="grid gap-3">
      <input id="cNom" placeholder="Nombre completo *" class="border-2 rounded-full px-4 py-3 text-xs"><div class="grid grid-cols-2 gap-2"><input id="cTel" placeholder="WhatsApp *" class="border-2 rounded-full px-4 py-3 text-xs"><input id="cTel2" placeholder="Tel fijo" class="border-2 rounded-full px-4 py-3 text-xs"></div>
      <div class="grid grid-cols-2 gap-2"><select id="cComuna" class="border-2 rounded-full px-4 py-3 text-xs bg-white"><option value="">Comuna *</option></select><select id="cBarrio" class="border-2 rounded-full px-4 py-3 text-xs bg-white"><option value="">Barrio *</option></select></div>
      <select id="cEstrato" class="border-2 rounded-full px-4 py-3 text-xs bg-white"><option value="">Estrato</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
      <input id="cDir" placeholder="Dirección exacta" class="border-2 rounded-full px-4 py-3 text-xs"><input id="cDirLink" placeholder="Link Google Maps" class="border-2 rounded-full px-4 py-3 text-xs">
      <div class="bg-gray-50 rounded-2xl p-3"><p class="text-[10px] font-bold mb-2">SERVICIO</p><div class="flex flex-wrap gap-1.5"><label class="text-[10px] bg-white border px-3 py-1.5 rounded-full"><input type="checkbox" value="Aseo general" class="cTipo"> Aseo</label><label class="text-[10px] bg-white border px-3 py-1.5 rounded-full"><input type="checkbox" value="Bebé" class="cTipo"> Bebé</label><label class="text-[10px] bg-white border px-3 py-1.5 rounded-full"><input type="checkbox" value="Adulto mayor" class="cTipo"> Adulto mayor</label><label class="text-[10px] bg-white border px-3 py-1.5 rounded-full"><input type="checkbox" value="Interna" class="cTipo"> Interna</label></div><div class="grid grid-cols-4 gap-1 mt-3"><label class="text-[9px] bg-white border px-2 py-1 rounded-full text-center"><input type="checkbox" value="Lun" class="cDias"> Lun</label><label class="text-[9px] bg-white border px-2 py-1 rounded-full text-center"><input type="checkbox" value="Mar" class="cDias"> Mar</label><label class="text-[9px] bg-white border px-2 py-1 rounded-full text-center"><input type="checkbox" value="Mie" class="cDias"> Mié</label><label class="text-[9px] bg-white border px-2 py-1 rounded-full text-center"><input type="checkbox" value="Jue" class="cDias"> Jue</label><label class="text-[9px] bg-white border px-2 py-1 rounded-full text-center"><input type="checkbox" value="Vie" class="cDias"> Vie</label><label class="text-[9px] bg-white border px-2 py-1 rounded-full text-center"><input type="checkbox" value="Sab" class="cDias"> Sáb</label><label class="text-[9px] bg-white border px-2 py-1 rounded-full text-center"><input type="checkbox" value="Dom" class="cDias"> Dom</label></div></div>
      <div class="grid grid-cols-2 gap-2"><div><label class="text-[9px] opacity-60">Tarifa / día</label><input id="cPago" type="number" placeholder="110000" class="w-full border-2 rounded-full px-4 py-3 text-xs mt-1"></div><div><label class="text-[9px] opacity-60">Deuda</label><input id="cDeuda" type="number" placeholder="0" class="w-full border-2 rounded-full px-4 py-3 text-xs mt-1"></div></div>
      <textarea id="cNotas" placeholder="Notas..." class="border-2 rounded-2xl p-3 text-xs h-20"></textarea>
      <select id="cEstado" class="border-2 rounded-full px-4 py-3 text-xs bg-white"><option value="Activo">Activo</option><option value="Inactivo">Inactivo</option><option value="Moroso">Moroso</option><option value="VIP">VIP</option></select>
    </div>
    <div class="flex gap-2 mt-5"><button onclick="saveCliMejorado()" id="btnSaveCli" class="flex-1 bg-black text-white rounded-full py-3.5 text-xs font-bold">Guardar</button><button onclick="closeModalCliente()" class="border-2 px-5 rounded-full text-xs font-bold">Cerrar</button></div>
  </div>
</div>
<div id="modalFichaCli" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-[24px] p-5 w-full max-w-md max-h-[90vh] overflow-y-auto"><div class="flex justify-between"><h2 id="fichaNombre" class="font-black text-sm">Ficha</h2><button onclick="document.getElementById('modalFichaCli').classList.add('hidden')" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><div id="fichaContent" class="mt-3"></div><div id="fichaWA" class="mt-3 grid gap-2"></div><div id="fichaHistorial" class="mt-4"></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig = { apiKey: "AIzaSyBTAApo5GBupOPheePyOo3Qbs-9j4BA7i4", authDomain: "empleadas-caseras.firebaseapp.com", projectId: "empleadas-caseras", storageBucket: "empleadas-caseras.firebasestorage.app", messagingSenderId: "125301957543", appId: "1:125301957543:web:b20385407f6e3e1b090c82" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const storage = getStorage(app);
const comunasList = ["C1","C2","C3","C4","C5","C6","C7","C8","C9","C10","C11","C12","C13","C14","C15","C16","C17","C18","C19","C20","C21","C22","CORREGIMIENTOS"];
const barriosData = {"C1":["Terrón Colorado"],"C2":["Granada","Chipichape"],"C17":["El Ingenio","Caney","Lili","Unicentro","Capri"],"C22":["Ciudad Jardín","Campestre","Pance"],"C15":["Ciudad Córdoba"],"C6":["Floralia"]};
const allSkills = ["Bebés 0-2","Niños 3-10","Adulto Mayor","Cocina Valluna","Aseo Profundo","Interna","Fin de semana","Mascotas"];
let editId=null, editCliId=null, cacheEmp=[], cacheCli=[], cacheAge=[];
window.entrar = () => { if(document.getElementById('pass').value === 'admin123'){ document.getElementById('login').classList.add('hidden'); document.getElementById('panel').classList.remove('hidden'); iniciar(); } else { document.getElementById('errLogin').classList.remove('hidden'); } };
function iniciar(){
  const selCom = document.getElementById('aComuna'); selCom.innerHTML = '<option value="">Comuna *</option>' + comunasList.map(c=>`<option value="${c}">${c}</option>`).join('');
  selCom.onchange = () => { const selBar = document.getElementById('aBarrio'); selBar.innerHTML = '<option value="">Barrio *</option>'; (barriosData[selCom.value]||["Centro"]).forEach(b=>{ const o=document.createElement('option'); o.value=b; o.textContent=b; selBar.appendChild(o); }); };
  const selCCom = document.getElementById('cComuna'); selCCom.innerHTML = '<option value="">Comuna *</option>' + comunasList.map(c=>`<option value="${c}">${c}</option>`).join('');
  selCCom.onchange = () => { const selBar = document.getElementById('cBarrio'); selBar.innerHTML = '<option value="">Barrio *</option>'; (barriosData[selCCom.value]||["Centro"]).forEach(b=>{ const o=document.createElement('option'); o.value=b; o.textContent=b; selBar.appendChild(o); }); };
  document.getElementById('skillsBox').innerHTML = allSkills.map(s=>`<label class="text-[10px] bg-gray-100 px-3 py-1.5 rounded-full cursor-pointer border"><input type="checkbox" value="${s}" class="sk mr-1">${s}</label>`).join('');
  document.getElementById('mesP').value = new Date().toISOString().slice(0,7); document.getElementById('agFecha').value = new Date().toISOString().slice(0,10);
  ['agEnt','agSal','agEmp'].forEach(id=>{ document.getElementById(id).addEventListener('change', calcular); });
  onSnapshot(query(collection(db,"empleadas_v4"), orderBy("creado","desc")), snap=>{ cacheEmp=[]; snap.forEach(d=>cacheEmp.push({id:d.id,...d.data()})); renderEmp(); fillSelects(); calcular(); });
  onSnapshot(query(collection(db,"clientes"), orderBy("creado","desc")), snap=>{ cacheCli=[]; snap.forEach(d=>cacheCli.push({id:d.id,...d.data()})); renderCli(); fillSelects(); });
  onSnapshot(query(collection(db,"agenda"), orderBy("fecha","desc")), snap=>{ cacheAge=[]; snap.forEach(d=>cacheAge.push({id:d.id,...d.data()})); renderAge(); renderPagos(); });
}
function calcular(){ const ent = document.getElementById('agEnt').value; const sal = document.getElementById('agSal').value; if(!ent ||!sal) return 8; const [he,me]=ent.split(':').map(Number); const [hs,ms]=sal.split(':').map(Number); let horas = (hs + ms/60) - (he + me/60); if(horas < 0) horas += 24; const emp = cacheEmp.find(e=>e.id===document.getElementById('agEmp').value); const gan = emp? (emp.cobroDia||110000)-(emp.pagoDia||85000) : 25000; document.getElementById('calcHoras').innerText = horas.toFixed(1)+'h'; document.getElementById('calcGan').innerText = '$'+gan.toLocaleString(); return horas; }
window.tab = (t) => { document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden')); document.getElementById('v-'+t).classList.remove('hidden'); document.querySelectorAll('.tab').forEach(b=>{ b.classList.remove('bg-black','text-white'); b.classList.add('bg-white'); }); document.getElementById('t-'+t).classList.add('bg-black','text-white'); document.getElementById('t-'+t).classList.remove('bg-white'); };
function fillSelects(){ document.getElementById('agEmp').innerHTML = cacheEmp.map(e=>`<option value="${e.id}">${e.nombre} - $${e.pagoDia||85000}/$${e.cobroDia||110000}</option>`).join(''); let cliHtml = cacheCli.map(c=>`<option value="${c.id}">${c.nombre} - ${c.barrio||''}</option>`).join(''); cliHtml = `<option value="">Cliente General</option>` + cliHtml; document.getElementById('agCli').innerHTML = cliHtml; calcular(); }
window.renderEmp = () => { const q = document.getElementById('buscE').value.toLowerCase(); const list = cacheEmp.filter(e=>(e.nombre||'').toLowerCase().includes(q)); document.getElementById('countEmp').innerText = list.length; document.getElementById('topStats').innerText = `${cacheEmp.length} empleadas • ${cacheCli.length} clientes • ${cacheAge.length} servicios`; document.getElementById('listaEmp').innerHTML = list.map(e=>`<div class="bg-white rounded-[18px] p-4 border shadow-sm"><div class="flex gap-3"><img src="${e.foto||'https://ui-avatars.com/api/?name='+encodeURIComponent(e.nombre)}" class="w-12 h-12 rounded-full object-cover"><div class="flex-1"><b class="text-xs">${e.nombre} ${e.edad?'('+e.edad+' años)':''}</b><p class="text-[10px] opacity-60">${e.comuna||''} ${e.barrio||''} • Int $${e.pagoDia||0} → Cob $${e.cobroDia||0}</p><p class="text-[10px] mt-1"><span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full">${e.estado||'Disponible'}</span></p></div></div><div class="flex gap-2 mt-3"><button onclick="editar('${e.id}')" class="flex-1 bg-black text-white rounded-full py-2 text-[10px] font-bold">Editar</button><button onclick="borrarEmp('${e.id}')" class="border-2 px-4 rounded-full text-[10px] font-bold">Borrar</button></div></div>`).join(''); };
window.openModalCliente = (id=null) => { editCliId = id; document.getElementById('modalCliente').classList.remove('hidden'); if(id){ const c = cacheCli.find(x=>x.id===id); document.getElementById('titleCli').innerText = 'Editando: '+c.nombre; cNom.value=c.nombre; cTel.value=c.telefono||''; cTel2.value=c.telefono2||''; cComuna.value=c.comuna||''; cComuna.dispatchEvent(new Event('change')); setTimeout(()=>{ cBarrio.value=c.barrio||''; },200); cEstrato.value=c.estrato||''; cDir.value=c.direccion||''; cDirLink.value=c.maps||''; cPago.value=c.pagoAcordado||''; cDeuda.value=c.deuda||0; cNotas.value=c.notas||''; cEstado.value=c.estado||'Activo'; document.querySelectorAll('.cTipo').forEach(ch=> ch.checked = (c.tipos||[]).includes(ch.value)); document.querySelectorAll('.cDias').forEach(ch=> ch.checked = (c.dias||[]).includes(ch.value)); } else { document.getElementById('titleCli').innerText='Nuevo Cliente'; ['cNom','cTel','cTel2','cDir','cDirLink','cPago','cDeuda','cNotas'].forEach(i=>document.getElementById(i).value=''); document.querySelectorAll('.cTipo,.cDias').forEach(c=>c.checked=false); } };
window.closeModalCliente = () => { document.getElementById('modalCliente').classList.add('hidden'); editCliId=null; };
window.saveCliMejorado = async () => { if(!cNom.value.trim()) return alert('Falta nombre'); const btn = document.getElementById('btnSaveCli'); btn.innerText='Guardando...'; btn.disabled=true; const data = { nombre:cNom.value.trim(), telefono:cTel.value.trim(), telefono2:cTel2.value.trim(), comuna:cComuna.value, barrio:cBarrio.value, estrato:cEstrato.value, direccion:cDir.value.trim(), maps:cDirLink.value.trim(), tipos:[...document.querySelectorAll('.cTipo:checked')].map(c=>c.value), dias:[...document.querySelectorAll('.cDias:checked')].map(c=>c.value), pagoAcordado:Number(cPago.value||110000), deuda:Number(cDeuda.value||0), notas:cNotas.value.trim(), estado:cEstado.value }; try{ if(editCliId) await updateDoc(doc(db,"clientes",editCliId), data); else await addDoc(collection(db,"clientes"), {...data, creado:serverTimestamp()}); closeModalCliente(); }catch(e){ alert(e.message); } btn.innerText='Guardar'; btn.disabled=false; };
window.renderCli = () => { const q = (document.getElementById('buscCli')?.value||'').toLowerCase(); const lista = cacheCli.filter(c=> (c.nombre+c.barrio+(c.comuna||'')).toLowerCase().includes(q)); document.getElementById('statsClientes').innerText = `${lista.length} clientes`; document.getElementById('listaCli').innerHTML = lista.map(c=>{ return `<div class="bg-white rounded-[18px] p-4 border shadow-sm"><div class="flex justify-between"><div><b class="text-sm">${c.nombre}</b><p class="text-[11px] opacity-60">${c.comuna||''} ${c.barrio||''} • $${(c.pagoAcordado||0).toLocaleString()}</p></div><b class="text-xs">$${(c.pagoAcordado||0).toLocaleString()}</b></div><div class="grid grid-cols-2 gap-2 mt-3"><a href="https://wa.me/57${c.telefono}" target="_blank" class="bg-green-600 text-white py-2 rounded-full text-[11px] text-center font-bold">WA</a><button onclick="verFicha('${c.id}')" class="bg-black text-white py-2 rounded-full text-[11px] font-bold">Ficha + WA</button><button onclick="openModalCliente('${c.id}')" class="border-2 py-2 rounded-full text-[11px] font-bold">Editar</button><button onclick="borrarCli('${c.id}')" class="bg-red-50 text-red-600 border py-2 rounded-full text-[11px] font-bold">🗑️</button></div></div>`; }).join(''); };
window.verFicha = (id) => { const c = cacheCli.find(x=>x.id===id); document.getElementById('modalFichaCli').classList.remove('hidden'); document.getElementById('fichaNombre').innerText = c.nombre; document.getElementById('fichaContent').innerHTML = `<p class="text-xs"><b>${c.comuna} ${c.barrio}</b> - ${c.direccion}<br>Tel ${c.telefono}<br>Tarifa $${c.pagoAcordado}</p>`; document.getElementById('fichaWA').innerHTML = `<button onclick="copiarWA('Hola ${c.nombre} 👋 soy Brayton de Empleadas Cali. Servicio por día 7am-4pm $${c.pagoAcordado||110000}. ¿Para qué día en ${c.barrio}? Vio')" class="bg-black text-white p-2 rounded-xl text-[10px] text-left w-full">📋 Copiar Mensaje Cobro $${c.pagoAcordado}</button><button onclick="if(confirm('¿Borrar ${c.nombre}?')){borrarCli('${c.id}'); document.getElementById('modalFichaCli').classList.add('hidden')}" class="w-full bg-red-600 text-white py-2.5 rounded-full text-xs font-bold mt-2">🗑️ Borrar Cliente</button>`; const servs = cacheAge.filter(a=>a.clienteId===id); document.getElementById('fichaHistorial').innerHTML = servs.map(a=>`<div class="text-[11px] border-b py-1 flex justify-between"><span>${a.fecha}</span><span>$${a.cobro}</span></div>`).join(''); };
window.copiarWA = (txt) => { navigator.clipboard.writeText(txt); alert('Copiado ✅'); };
window.renderAge = () => { document.getElementById('listaAge').innerHTML = cacheAge.slice(0,100).map(a=>{ const e=cacheEmp.find(x=>x.id===a.empleadaId); const c=cacheCli.find(x=>x.id===a.clienteId); const gan = (a.cobro||0)-(a.pago||0); return `<div class="bg-white rounded-xl p-3 flex justify-between items-center text-xs border ${a.comisionCobrada?'bg-green-50':''}"><div><b>${a.fecha}</b> ${e?.nombre||''} → ${c?.nombre||'General'} ${a.comisionCobrada?'<span class="bg-green-600 text-white px-2 py-0.5 rounded-full">COBRADO</span>':''}<br><span class="opacity-60">Gan $${gan.toLocaleString()}</span></div><div class="flex gap-1">${!a.comisionCobrada?`<button onclick="cobrarComision('${a.id}')" class="bg-green-600 text-white px-3 py-2 rounded-full text-[10px] font-bold">💰 Cobrar</button>`:''}<button onclick="borrarAge('${a.id}')" class="w-7 h-7 bg-gray-100 rounded-full">✕</button></div></div>`; }).join(''); };
window.renderPagos = () => { const mes=document.getElementById('mesP').value; const ag=cacheAge.filter(a=>a.fecha && a.fecha.startsWith(mes)); const pag=ag.reduce((s,a)=>s+(Number(a.pago)||0),0); const cob=ag.reduce((s,a)=>s+(Number(a.cobro)||0),0); const ya=ag.filter(a=>a.comisionCobrada).reduce((s,a)=>s+((a.cobro||0)-(a.pago||0)),0); const falta=ag.filter(a=>!a.comisionCobrada).reduce((s,a)=>s+((a.cobro||0)-(a.pago||0)),0); document.getElementById('pPag').innerText='$'+pag.toLocaleString(); document.getElementById('pCob').innerText='$'+cob.toLocaleString(); document.getElementById('pGan').innerText='$'+(cob-pag).toLocaleString(); document.getElementById('pPre').innerText='$'+ya.toLocaleString(); document.getElementById('pFalta').innerText = falta>0?`⚠️ Falta por cobrar: $${falta.toLocaleString()}`:`✅ Todo cobrado`; document.getElementById('listaPag').innerHTML=ag.map(a=>`<div class="bg-white rounded-xl p-3 text-xs flex justify-between border ${a.comisionCobrada?'bg-green-50':''}"><span>${a.fecha}</span><span>$${a.cobro-a.pago} ${a.comisionCobrada?'✅':''}</span></div>`).join(''); };
window.editar = (id) => { const e=cacheEmp.find(x=>x.id===id); editId=id; document.getElementById('formTitle').innerText='Editando: '+e.nombre; document.getElementById('aNombre').value=e.nombre||''; document.getElementById('aTelefono').value=e.telefono||''; document.getElementById('aEdad').value=e.edad||''; document.getElementById('aComuna').value=e.comuna||''; document.getElementById('aComuna').dispatchEvent(new Event('change')); setTimeout(()=>{ document.getElementById('aBarrio').value=e.barrio||''; },200); document.getElementById('aEstrato').value=e.estrato||''; document.getElementById('aPagoDia').value=e.pagoDia||''; document.getElementById('aCobroDia').value=e.cobroDia||''; document.getElementById('aPagoPublico').value=e.pago||''; document.getElementById('aEstado').value=e.estado||'Disponible'; document.querySelectorAll('.sk').forEach(ch=>{ ch.checked=(e.skills||[]).includes(ch.value); }); window.scrollTo({top:0,behavior:'smooth'}); tab('empleadas'); };
window.limpiar = () => { editId=null; document.getElementById('formTitle').innerText='Nueva empleada'; ['aNombre','aTelefono','aEdad','aPagoDia','aCobroDia','aPagoPublico'].forEach(id=>document.getElementById(id).value=''); document.getElementById('aFotoFile').value=''; document.querySelectorAll('.sk').forEach(c=>c.checked=false); };
window.guardar = async () => { const nombre=document.getElementById('aNombre').value.trim(); if(!nombre) return alert('Falta nombre'); const btn=document.getElementById('btnGuardar'); btn.innerText='Guardando...'; btn.disabled=true; try{ let foto= (cacheEmp.find(x=>x.id===editId)?.foto) || ''; const file=document.getElementById('aFotoFile').files[0]; if(file){ const r=ref(storage,'empleadas/'+Date.now()+'_'+file.name); await uploadBytes(r,file); foto=await getDownloadURL(r); } const data={ nombre, telefono:document.getElementById('aTelefono').value.trim(), edad:document.getElementById('aEdad').value.trim(), comuna:document.getElementById('aComuna').value, barrio:document.getElementById('aBarrio').value, estrato:document.getElementById('aEstrato').value, pagoDia:Number(document.getElementById('aPagoDia').value||85000), cobroDia:Number(document.getElementById('aCobroDia').value||110000), pago:Number(document.getElementById('aPagoPublico').value||90000), estado:document.getElementById('aEstado').value, foto, skills:[...document.querySelectorAll('.sk:checked')].map(c=>c.value) }; if(editId){ await updateDoc(doc(db,"empleadas_v4",editId), data); } else { await addDoc(collection(db,"empleadas_v4"), {...data, creado:serverTimestamp()}); } limpiar(); }catch(e){ alert('Error: '+e.message); } btn.innerText='Guardar'; btn.disabled=false; };
window.saveAgenda = async () => { const sel=document.getElementById('agEmp'); if(!sel.value) return alert('Crea empleada'); const horas = calcular() || 8; const e=cacheEmp.find(x=>x.id===sel.value); await addDoc(collection(db,"agenda"),{ fecha:agFecha.value, empleadaId:agEmp.value, clienteId:document.getElementById('agCli').value || "general", entrada:agEnt.value, salida:agSal.value, horas:horas, pago:Number(e?.pagoDia||85000), cobro:Number(e?.cobroDia||110000), comisionCobrada:false, creado:serverTimestamp() }); };
window.cobrarComision = async (id) => { await updateDoc(doc(db,"agenda",id), { comisionCobrada:true, fechaCobro:new Date().toISOString() }); };
window.borrarEmp = async (id) => { if(!confirm('¿Borrar empleada?')) return; await deleteDoc(doc(db,"empleadas_v4",id)); };
window.borrarCli = async (id) => { if(!confirm('¿Borrar cliente?')) return; await deleteDoc(doc(db,"clientes",id)); };
window.borrarAge = async (id) => { if(!confirm('¿Borrar servicio?')) return; await deleteDoc(doc(db,"agenda",id)); };
window.borrarTodoSinRastro = async () => {
  const t1 = prompt('⚠️ BORRARÁ TODO. Escribe BORRAR TODO para continuar');
  if(t1!== 'BORRAR TODO') return alert('Cancelado');
  const t2 = prompt('Escribe admin123 para confirmar');
  if(t2!== 'admin123') return alert('Clave mal');
  if(!confirm('ÚLTIMA CONFIRMACIÓN: ¿Borrar TODAS las empleadas, clientes y agenda? No se puede recuperar.')) return;
  try{
    for(const col of ["empleadas_v4","clientes","agenda"]){
      const s = await getDocs(collection(db, col));
      for(const d of s.docs){ await deleteDoc(doc(db, col, d.id)); }
    }
    alert('✅ Todo borrado sin rastro. Recargando...');
    location.reload();
  }catch(e){ alert('Error: '+e.message); }
};
window.exportar = () => { let csv='Fecha,Empleada,Cliente,Pago,Cobro,Ganancia,Cobrado\n'; cacheAge.forEach(a=>{ const e=cacheEmp.find(x=>x.id===a.empleadaId); const c=cacheCli.find(x=>x.id===a.clienteId); csv+=`${a.fecha},${e?.nombre||''},${c?.nombre||'General'},${a.pago},${a.cobro},${a.cobro-a.pago},${a.comisionCobrada?'SI':'NO'}\n`; }); const blob=new Blob([csv],{type:'text/csv'}); const aTag=document.createElement('a'); aTag.href=URL.createObjectURL(blob); aTag.download='ganancias_'+document.getElementById('mesP').value+'.csv'; aTag.click(); };
</script>
