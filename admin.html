</div>
<div id="modalCliente" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">

    <div class="grid gap-3">
      <input id="cNom" placeholder="Nombre completo *" class="border-2 rounded-full px-4 py-3 text-xs outline-none focus:border-black">

      <div class="grid grid-cols-2 gap-2"><div><label class="text-[9px] opacity-60">Tarifa / día</label><input id="cPago" type="number" placeholder="110000" class="w-full border-2 rounded-full px-4 py-3 text-xs mt-1"></div><div><label class="text-[9px] opacity-60">Deuda</label><input id="cDeuda" type="number" placeholder="0" class="w-full border-2 rounded-full px-4 py-3 text-xs mt-1"></div></div>
      <textarea id="cNotas" placeholder="Notas: mascota, código portería..." class="border-2 rounded-2xl p-3 text-xs h-20"></textarea>
      <select id="cEstado" class="border-2 rounded-full px-4 py-3 text-xs bg-white"><option value="Activo">Activo</option><option value="Inactivo">Inactivo</option><option value="Moroso">Moroso</option><option value="VIP">VIP</option></select>
    </div>
    <div class="flex gap-2 mt-5"><button onclick="saveCliMejorado()" id="btnSaveCli" class="flex-1 bg-black text-white rounded-full py-3.5 text-xs font-bold">Guardar Cliente</button><button onclick="closeModalCliente()" class="border-2 px-5 rounded-full text-xs font-bold">Cerrar</button></div>
  </div>
</div>
<div id="modalFichaCli" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-[24px] p-5 w-full max-w-md max-h-[90vh] overflow-y-auto"><div class="flex justify-between"><h2 id="fichaNombre" class="font-black text-sm">Ficha</h2><button onclick="document.getElementById('modalFichaCli').classList.add('hidden')" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><div id="fichaContent" class="mt-3"></div><div id="fichaHistorial" class="mt-4"></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig = { apiKey: "AIzaSyBTAApo5GBupOPheePyOo3Qbs-9j4BA7i4", authDomain: "empleadas-caseras.firebaseapp.com", projectId: "empleadas-caseras", storageBucket: "empleadas-caseras.firebasestorage.app", messagingSenderId: "125301957543", appId: "1:125301957543:web:b20385407f6e3e1b090c82" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const storage = getStorage(app);
const comunasList = ["C1","C2","C3","C4","C5","C6","C7","C8","C9","C10","C11","C12","C13","C14","C15","C16","C17","C18","C19","C20","C21","C22","CORREGIMIENTOS"];
const barriosData = {"C1":["Terrón Colorado","Aguacatal","Vista Hermosa","Patio Bonito","Villa del Mar"],"C2":["Granada","Versalles","Centenario","Santa Mónica","Normandía","Juanambú","San Vicente","Chipichape","La Flora","La Campiña","Santa Teresita","Arboledas","Vipasa","La Paz","Altos de Menga"],"C3":["San Antonio","El Peñón","San Cayetano","El Nacional","Santa Rosa","La Merced","El Calvario"],"C4":["Bolívar","Berlín","Olaya Herrera","La Isla","Salomia","Las Delicias"],"C5":["Chiminangos","Los Parques","Torres de Comfandi","Villa del Sol","Metropolitano del Norte"],"C6":["Petecuy","Los Guaduales","La Rivera","Floraría","Ciudadela Floralia","Fonaviemcali","San Luis"],"C7":["Alfonso López","Puerto Mallarino","Los Pinos","Siete de Agosto","Andrés Sanín"],"C8":["Villa Colombia","El Troncal","Industrial","Atanasio Girardot","Municipal","Benjamín Herrera","La Floresta"],"C9":["Bretaña","Belalcázar","Alameda","Tequendama","Junín","Guayaquil","Aranjuez"],"C10":["El Guabal","La Libertad","Santo Domingo","Colseguros","Panamericano","Las Granjas","San Cristóbal","San Judas","Santa Elena"],"C11":["Ciudad Modelo","La Esperanza","Gran Colombia","Villa del Sur","San Benito"],"C12":["Nueva Floresta","El Rodeo","Fenalco Kennedy","Julio Rincón","Doce de Octubre","El Paraíso","Villanueva"],"C13":["Ulpiano Lloreda","El Diamante","Lleras Camargo","Los Lagos","Los Robles","Charco Azul","Comuneros 1","El Poblado","Calipso","Marroquín"],"C14":["Manuela Beltrán","Las Orquídeas","Afirmación Social","Alirio Mora Beltrán","Puente de Piedra"],"C15":["El Retiro","Mojica","Laureano Gómez","El Vallado","Comuneros 2","Ciudad Córdoba"],"C16":["La Unión","Antonio Nariño","República de Israel","Brisas del Limonar","Mariano Ramos","Ciudad 2000"],"C17":["El Ingenio","Caney","Lili","Mayapan","Ciudadela Comfandi","Prados del Limonar","Bosques del Limonar","Unicentro","La Hacienda","Capri","Ciudad Capri","El Gran Limonar","Cañaverales","Santa Anita","Ciudadela Pasoancho"],"C18":["Meléndez","Nápoles","Buenos Aires","Los Farallones","Prados del Sur","Alférez Real","Caldas","Mario Correa Rengifo"],"C19":["Bellavista","El Cedro","Tejares Cristales","Pampalinda","Camino Real","Los Cámbulos","Cañaveralejo","Cuarto de Legua","El Refugio","El Lido","San Fernando","Santa Bárbara","Champagnat"],"C20":["Siloé","Lleras Camargo","Belisario Caicedo","Cortijo","Brisas de Mayo","Tierra Blanca","Venezuela"],"C21":["Desepaz","Talanga","Compartir","Ciudadela del Río","Ciudad Talanga","Valle Grande","Pízamos","La Paz"],"C22":["Ciudad Jardín","Ciudad Campestre","Ciudad Pacífica","Club Campestre","Parcelaciones Pance","Bochalema","Vicaya","El Castillo","Pance"],"CORREGIMIENTOS":["Pance","La Buitrera","Villacarmelo","Los Andes","Pichindé","Felidia","La Elvira","El Saladito","La Castilla","La Paz","Golondrinas","Montebello","La Leonera","Hormiguero","Navarro"]};
const allSkills = ["Bebés 0-2","Niños 3-10","Adulto Mayor","Cocina Valluna","Aseo Profundo","Interna","Fin de semana","Mascotas"];
let editId=null, editCliId=null, cacheEmp=[], cacheCli=[], cacheAge=[];
window.entrar = () => { if(document.getElementById('pass').value === 'admin123'){ document.getElementById('login').classList.add('hidden'); document.getElementById('panel').classList.remove('hidden'); iniciar(); } else { document.getElementById('errLogin').classList.remove('hidden'); } };
function iniciar(){
  const selCom = document.getElementById('aComuna'); selCom.innerHTML = '<option value="">Comuna *</option>' + comunasList.map(c=>`<option value="${c}">${c}</option>`).join('');
  selCom.onchange = () => { const selBar = document.getElementById('aBarrio'); selBar.innerHTML = '<option value="">Barrio *</option>'; (barriosData[selCom.value]||[]).forEach(b=>{ const o=document.createElement('option'); o.value=b; o.textContent=b; selBar.appendChild(o); }); };
  const selCCom = document.getElementById('cComuna'); selCCom.innerHTML = '<option value="">Comuna *</option>' + comunasList.map(c=>`<option value="${c}">${c}</option>`).join('');
  selCCom.onchange = () => { const selBar = document.getElementById('cBarrio'); selBar.innerHTML = '<option value="">Barrio *</option>'; (barriosData[selCCom.value]||[]).forEach(b=>{ const o=document.createElement('option'); o.value=b; o.textContent=b; selBar.appendChild(o); }); };
  document.getElementById('skillsBox').innerHTML = allSkills.map(s=>`<label class="text-[10px] bg-gray-100 px-3 py-1.5 rounded-full cursor-pointer border"><input type="checkbox" value="${s}" class="sk mr-1">${s}</label>`).join('');
  document.getElementById('mesP').value = new Date().toISOString().slice(0,7); document.getElementById('agFecha').value = new Date().toISOString().slice(0,10);
  ['agEnt','agSal','agEmp'].forEach(id=>{ document.getElementById(id).addEventListener('change', calcular); });
  onSnapshot(query(collection(db,"empleadas_v4"), orderBy("creado","desc")), snap=>{ cacheEmp=[]; snap.forEach(d=>cacheEmp.push({id:d.id,...d.data()})); renderEmp(); fillSelects(); calcular(); });
  onSnapshot(query(collection(db,"clientes"), orderBy("creado","desc")), snap=>{ cacheCli=[]; snap.forEach(d=>cacheCli.push({id:d.id,...d.data()})); renderCli(); fillSelects(); });
  onSnapshot(query(collection(db,"agenda"), orderBy("fecha","desc")), snap=>{ cacheAge=[]; snap.forEach(d=>cacheAge.push({id:d.id,...d.data()})); renderAge(); renderPagos(); });
}
function calcular(){ const ent = document.getElementById('agEnt').value; const sal = document.getElementById('agSal').value; if(!ent ||!sal) return 8; const [he,me]=ent.split(':').map(Number); const [hs,ms]=sal.split(':').map(Number); let horas = (hs + ms/60) - (he + me/60); if(horas < 0) horas += 24; const emp = cacheEmp.find(e=>e.id===document.getElementById('agEmp').value); const gan = emp? (emp.cobroDia||110000)-(emp.pagoDia||85000) : 25000; document.getElementById('calcHoras').innerText = horas.toFixed(1)+'h'; document.getElementById('calcGan').innerText = '$'+gan.toLocaleString(); return horas; }
window.tab = (t) => { document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden')); document.getElementById('v-'+t).classList.remove('hidden'); document.querySelectorAll('.tab').forEach(b=>{ b.classList.remove('bg-black','text-white'); b.classList.add('bg-white'); }); document.getElementById('t-'+t).classList.add('bg-black','text-white'); document.getElementById('t-'+t).classList.remove('bg-white'); };
function fillSelects(){ document.getElementById('agEmp').innerHTML = cacheEmp.map(e=>`<option value="${e.id}">${e.nombre} - $${e.pagoDia||85000}/$${e.cobroDia||110000}</option>`).join(''); let cliHtml = cacheCli.map(c=>`<option value="${c.id}">${c.nombre} - ${c.barrio||''} ${c.comuna||''}</option>`).join(''); cliHtml = `<option value="">Cliente General</option>` + cliHtml; document.getElementById('agCli').innerHTML = cliHtml; calcular(); }
window.renderEmp = () => { const q = document.getElementById('buscE').value.toLowerCase(); const list = cacheEmp.filter(e=>(e.nombre||'').toLowerCase().includes(q)); document.getElementById('countEmp').innerText = list.length; document.getElementById('topStats').innerText = `${cacheEmp.length} empleadas • ${cacheCli.length} clientes • ${cacheAge.length} servicios`; document.getElementById('listaEmp').innerHTML = list.map(e=>`<div class="bg-white rounded-[18px] p-4 border shadow-sm"><div class="flex gap-3"><img src="${e.foto||'https://ui-avatars.com/api/?name='+encodeURIComponent(e.nombre)}" class="w-12 h-12 rounded-full object-cover"><div class="flex-1"><b class="text-xs">${e.nombre}</b><p class="text-[10px] opacity-60">${e.comuna||''} ${e.barrio||''} Estrato ${e.estrato||''} • Int $${e.pagoDia||0} → Cob $${e.cobroDia||0}</p><p class="text-[10px] mt-1"><span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full">${e.estado||'Disponible'}</span></p></div></div><div class="flex gap-2 mt-3"><button onclick="editar('${e.id}')" class="flex-1 bg-black text-white rounded-full py-2 text-[10px] font-bold">Editar</button><button onclick="borrarEmp('${e.id}')" class="border-2 px-4 rounded-full text-[10px] font-bold">Borrar</button></div></div>`).join(''); };
window.openModalCliente = (id=null) => { editCliId = id; document.getElementById('modalCliente').classList.remove('hidden'); if(id){ const c = cacheCli.find(x=>x.id===id); document.getElementById('titleCli').innerText = 'Editando: '+c.nombre; cNom.value=c.nombre; cTel.value=c.telefono||''; cTel2.value=c.telefono2||''; cComuna.value=c.comuna||''; cComuna.dispatchEvent(new Event('change')); setTimeout(()=>{ cBarrio.value=c.barrio||''; },200); cEstrato.value=c.estrato||''; cDir.value=c.direccion||''; cDirLink.value=c.maps||''; cPago.value=c.pagoAcordado||''; cDeuda.value=c.deuda||0; cNotas.value=c.notas||''; cEstado.value=c.estado||'Activo'; document.querySelectorAll('.cTipo').forEach(ch=> ch.checked = (c.tipos||[]).includes(ch.value)); document.querySelectorAll('.cDias').forEach(ch=> ch.checked = (c.dias||[]).includes(ch.value)); } else { document.getElementById('titleCli').innerText='Nuevo Cliente'; ['cNom','cTel','cTel2','cDir','cDirLink','cPago','cDeuda','cNotas'].forEach(i=>document.getElementById(i).value=''); document.querySelectorAll('.cTipo,.cDias').forEach(c=>c.checked=false); } };
window.closeModalCliente = () => { document.getElementById('modalCliente').classList.add('hidden'); editCliId=null; };
window.saveCliMejorado = async () => { if(!cNom.value.trim()) return alert('Falta nombre'); const btn = document.getElementById('btnSaveCli'); btn.innerText='Guardando...'; btn.disabled=true; const data = { nombre:cNom.value.trim(), telefono:cTel.value.trim(), telefono2:cTel2.value.trim(), comuna:cComuna.value, barrio:cBarrio.value, estrato:cEstrato.value, direccion:cDir.value.trim(), maps:cDirLink.value.trim(), tipos:[...document.querySelectorAll('.cTipo:checked')].map(c=>c.value), dias:[...document.querySelectorAll('.cDias:checked')].map(c=>c.value), pagoAcordado:Number(cPago.value||110000), deuda:Number(cDeuda.value||0), notas:cNotas.value.trim(), estado:cEstado.value }; try{ if(editCliId) await updateDoc(doc(db,"clientes",editCliId), data); else await addDoc(collection(db,"clientes"), {...data, creado:serverTimestamp()}); closeModalCliente(); }catch(e){ alert(e.message); } btn.innerText='Guardar Cliente'; btn.disabled=false; };
window.renderCli = () => { const q = (document.getElementById('buscCli')?.value||'').toLowerCase(); const lista = cacheCli.filter(c=> (c.nombre+c.barrio+(c.comuna||'')+(c.direccion||'')).toLowerCase().includes(q)); document.getElementById('statsClientes').innerText = `${lista.length} clientes • ${cacheCli.filter(c=>c.estado==='Moroso').length} morosos • $${cacheCli.reduce((s,c)=>s+(c.deuda||0),0).toLocaleString()} por cobrar`; document.getElementById('listaCli').innerHTML = lista.map(c=>{ const servs = cacheAge.filter(a=>a.clienteId===c.id); const totalCobrado = servs.reduce((s,a)=>s+(Number(a.cobro)||0),0); const estadoColor = c.estado==='Moroso'?'bg-red-100 text-red-700': c.estado==='VIP'?'bg-yellow-100 text-yellow-700':'bg-green-100 text-green-700'; return `<div class="bg-white rounded-[18px] p-4 border shadow-sm"><div class="flex justify-between items-start"><div><b class="text-sm">${c.nombre}</b><span class="ml-2 text-[9px] px-2 py-0.5 rounded-full ${estadoColor}">${c.estado||'Activo'}</span><p class="text-[11px] opacity-60 mt-1"><i class="fa fa-map-marker"></i> ${c.comuna||''} ${c.barrio||''} ${c.direccion||''} • Estrato ${c.estrato||''}</p><p class="text-[10px] mt-1">${(c.dias||[]).join('-')} • ${(c.tipos||[]).join(', ')}</p></div><div class="text-right"><p class="text-[10px] opacity-60">Tarifa</p><b class="text-xs">$${(c.pagoAcordado||0).toLocaleString()}</b>${c.deuda>0?`<p class="text-[10px] text-red-600 font-bold">Debe $${c.deuda.toLocaleString()}</p>`:''}</div></div><p class="text-[11px] bg-gray-50 p-2 rounded-xl mt-3">${c.notas||'Sin notas'} • ${servs.length} servs • $${totalCobrado.toLocaleString()}</p><div class="grid grid-cols-2 gap-2 mt-3"><a href="https://wa.me/57${c.telefono}" target="_blank" class="bg-green-600 text-white py-2 rounded-full text-[11px] text-center font-bold"><i class="fab fa-whatsapp"></i> WA</a><button onclick="verFicha('${c.id}')" class="bg-black text-white py-2 rounded-full text-[11px] font-bold">Ficha</button><button onclick="openModalCliente('${c.id}')" class="border-2 py-2 rounded-full text-[11px] font-bold">Editar</button><button onclick="borrarCli('${c.id}')" class="bg-red-50 text-red-600 border border-red-200 py-2 rounded-full text-[11px] font-bold">🗑️ Borrar</button></div></div>`; }).join('') || '<p class="text-center opacity-40 text-xs py-10 col-span-3">Sin clientes</p>'; };
window.verFicha = (id) => { const c = cacheCli.find(x=>x.id===id); document.getElementById('modalFichaCli').classList.remove('hidden'); document.getElementById('fichaNombre').innerText = c.nombre; const servs = cacheAge.filter(a=>a.clienteId===id).slice(0,20); document.getElementById('fichaContent').innerHTML = `<div class="grid gap-2 text-xs"><p><b>WA:</b> ${c.telefono} ${c.telefono2?'/ '+c.telefono2:''}</p><p><b>Comuna:</b> ${c.comuna||''} • Barrio ${c.barrio||''} • Estrato ${c.estrato||''}</p><p><b>Dirección:</b> ${c.direccion} ${c.maps?`<a href="${c.maps}" target="_blank" class="text-blue-600 underline">Mapa</a>`:''}</p><p><b>Días:</b> ${(c.dias||[]).join(', ')||'No fijos'}</p><p><b>Serv:</b> ${(c.tipos||[]).join(', ')}</p><p><b>Tarifa:</b> $${c.pagoAcordado?.toLocaleString()} • <span class="${c.deuda>0?'text-red-600 font-bold':''}">Deuda: $${(c.deuda||0).toLocaleString()}</span></p><p class="bg-yellow-50 p-2 rounded-xl"><b>Notas:</b> ${c.notas||'Sin notas'}</p><button onclick="if(confirm('¿Borrar cliente ${c.nombre} definitivo? Esta acción no se puede deshacer')){borrarCli('${c.id}'); document.getElementById('modalFichaCli').classList.add('hidden')}" class="w-full mt-4 bg-red-600 text-white py-3 rounded-full text-xs font-bold">🗑️ Borrar Cliente Definitivo</button></div>`; document.getElementById('fichaHistorial').innerHTML = `<h3 class="font-bold text-xs mt-3">Historial (${servs.length})</h3>` + servs.map(a=>{ const e = cacheEmp.find(x=>x.id===a.empleadaId); return `<div class="flex justify-between text-[11px] border-b py-1.5"><span>${a.fecha} - ${e?.nombre||''}</span><span>$${a.cobro.toLocaleString()}</span></div>`; }).join(''); };
window.renderAge = () => { const unicos = []; const vistos = new Set(); cacheAge.forEach(a=>{ const key = a.fecha+'_'+a.empleadaId+'_'+a.clienteId; if(!vistos.has(key)){ vistos.add(key); unicos.push(a); } }); document.getElementById('listaAge').innerHTML = unicos.slice(0,100).map(a=>{ const e=cacheEmp.find(x=>x.id===a.empleadaId); const c=cacheCli.find(x=>x.id===a.clienteId); return `<div class="bg-white rounded-xl p-3 flex justify-between items-center text-xs border shadow-sm"><div><b>${a.fecha}</b> • ${e?.nombre||'Empleada'} → ${c?.nombre||'General'}<br><span class="opacity-60">${a.entrada||'07:00'}-${a.salida||'16:00'} (${a.horas||8}h) | Pago $${a.pago} Cobro $${a.cobro} | <span class="text-green-600 font-bold">Gan $${(a.cobro-a.pago).toLocaleString()}</span></span></div><button onclick="borrarAge('${a.id}')" class="w-7 h-7 bg-gray-100 rounded-full">✕</button></div>`; }).join('') || '<p class="text-center text-xs opacity-40 py-6">Sin servicios</p>'; };
window.renderPagos = () => { const mes=document.getElementById('mesP').value; const ag=cacheAge.filter(a=>a.fecha && a.fecha.startsWith(mes)); const pag=ag.reduce((s,a)=>s+(Number(a.pago)||0),0); const cob=ag.reduce((s,a)=>s+(Number(a.cobro)||0),0); document.getElementById('pPag').innerText='$'+pag.toLocaleString(); document.getElementById('pCob').innerText='$'+cob.toLocaleString(); document.getElementById('pGan').innerText='$'+(cob-pag).toLocaleString(); document.getElementById('pPre').innerText='$'+Math.round(pag*0.25).toLocaleString(); document.getElementById('listaPag').innerHTML=ag.map(a=>{ const e=cacheEmp.find(x=>x.id===a.empleadaId); return `<div class="bg-white rounded-xl p-3 text-xs flex justify-between border"><span>${a.fecha} - ${e?.nombre||''}</span><span class="font-bold">$${a.pago} → $${a.cobro} = <span class="text-green-600">$${a.cobro-a.pago}</span></span></div>`; }).join(''); };
window.editar = (id) => { const e=cacheEmp.find(x=>x.id===id); editId=id; document.getElementById('formTitle').innerText='Editando: '+e.nombre; document.getElementById('aNombre').value=e.nombre||''; document.getElementById('aTelefono').value=e.telefono||''; document.getElementById('aComuna').value=e.comuna||''; document.getElementById('aComuna').dispatchEvent(new Event('change')); setTimeout(()=>{ document.getElementById('aBarrio').value=e.barrio||''; },200); document.getElementById('aEstrato').value=e.estrato||''; document.getElementById('aPagoDia').value=e.pagoDia||''; document.getElementById('aCobroDia').value=e.cobroDia||''; document.getElementById('aPagoPublico').value=e.pago||''; document.getElementById('aEstado').value=e.estado||'Disponible'; document.querySelectorAll('.sk').forEach(ch=>{ ch.checked=(e.skills||[]).includes(ch.value); }); window.scrollTo({top:0,behavior:'smooth'}); tab('empleadas'); };
window.limpiar = () => { editId=null; document.getElementById('formTitle').innerText='Nueva empleada'; ['aNombre','aTelefono','aPagoDia','aCobroDia','aPagoPublico'].forEach(id=>document.getElementById(id).value=''); document.getElementById('aFotoFile').value=''; document.querySelectorAll('.sk').forEach(c=>c.checked=false); };
window.guardar = async () => { const nombre=document.getElementById('aNombre').value.trim(); if(!nombre) return alert('Falta nombre'); const btn=document.getElementById('btnGuardar'); btn.innerText='Guardando...'; btn.disabled=true; try{ let foto= (cacheEmp.find(x=>x.id===editId)?.foto) || ''; const file=document.getElementById('aFotoFile').files[0]; if(file){ const r=ref(storage,'empleadas/'+Date.now()+'_'+file.name); await uploadBytes(r,file); foto=await getDownloadURL(r); } const data={ nombre, telefono:document.getElementById('aTelefono').value.trim(), comuna:document.getElementById('aComuna').value, barrio:document.getElementById('aBarrio').value, estrato:document.getElementById('aEstrato').value, pagoDia:Number(document.getElementById('aPagoDia').value||85000), cobroDia:Number(document.getElementById('aCobroDia').value||110000), pago:Number(document.getElementById('aPagoPublico').value||90000), estado:document.getElementById('aEstado').value, foto, skills:[...document.querySelectorAll('.sk:checked')].map(c=>c.value) }; if(editId){ await updateDoc(doc(db,"empleadas_v4",editId), data); } else { await addDoc(collection(db,"empleadas_v4"), {...data, creado:serverTimestamp()}); } limpiar(); }catch(e){ alert('Error: '+e.message); } btn.innerText='Guardar'; btn.disabled=false; };
window.saveAgenda = async () => { const sel=document.getElementById('agEmp'); if(!sel.value) return alert('Crea empleada'); const horas = calcular() || 8; const existe = cacheAge.find(a=>a.fecha===agFecha.value && a.empleadaId===agEmp.value); if(existe) return alert('Ya agendaste a '+cacheEmp.find(e=>e.id===agEmp.value)?.nombre+' en esa fecha'); const e=cacheEmp.find(x=>x.id===sel.value); await addDoc(collection(db,"agenda"),{ fecha:agFecha.value, empleadaId:agEmp.value, clienteId:document.getElementById('agCli').value || "general", entrada:agEnt.value, salida:agSal.value, horas:horas, pago:Number(e?.pagoDia||85000), cobro:Number(e?.cobroDia||110000), creado:serverTimestamp() }); };
window.borrarEmp = async (id) => { if(!confirm('¿Borrar empleada?')) return; await deleteDoc(doc(db,"empleadas_v4",id)); };
window.borrarCli = async (id) => { if(!confirm('¿Borrar cliente? Esta acción no se puede deshacer')) return; await deleteDoc(doc(db,"clientes",id)); };
window.borrarAge = async (id) => { if(!confirm('¿Borrar servicio?')) return; await deleteDoc(doc(db,"agenda",id)); };
window.exportar = () => { let csv='Fecha,Empleada,Cliente,Entrada,Salida,Horas,Pago,Cobro,Ganancia\n'; cacheAge.forEach(a=>{ const e=cacheEmp.find(x=>x.id===a.empleadaId); const c=cacheCli.find(x=>x.id===a.clienteId); csv+=`${a.fecha},${e?.nombre||''},${c?.nombre||'General'},${a.entrada},${a.salida},${a.horas},${a.pago},${a.cobro},${a.cobro-a.pago}\n`; }); const blob=new Blob([csv],{type:'text/csv'}); const aTag=document.createElement('a'); aTag.href=URL.createObjectURL(blob); aTag.download='ganancias_'+document.getElementById('mesP').value+'.csv'; aTag.click(); };
</script>
