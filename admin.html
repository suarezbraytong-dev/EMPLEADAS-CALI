<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN - Empleadas Cali</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#f1f1f1] text-black">
<div id="login" class="min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-[24px] p-8 w-full max-w-sm shadow-xl">
<h1 class="font-black text-xl">ADMIN EMPLEADAS</h1>
<input id="pass" type="password" placeholder="Clave admin" class="w-full border-2 rounded-full px-4 py-3 text-sm mt-6 outline-none">
<button onclick="entrar()" class="w-full bg-black text-white rounded-full py-3 text-sm font-bold mt-3">Entrar</button>
<p id="errLogin" class="text-xs text-red-600 mt-2 hidden">Clave incorrecta</p>
</div>
</div>
<div id="panel" class="hidden">
<div class="bg-white border-b sticky top-0 z-20 p-4 flex justify-between items-center">
<b class="text-sm">ADMIN - <span id="totalAdmin">0</span> empleadas</b>
<div class="flex gap-2"><a href="index.html" target="_blank" class="border px-4 py-2 rounded-full text-xs">Ver web</a><button onclick="location.reload()" class="bg-black text-white px-4 py-2 rounded-full text-xs">Salir</button></div>
</div>
<div class="max-w-[1400px] mx-auto p-4 grid lg:grid-cols-[380px_1fr] gap-4">
<!-- FIX 1: lg:sticky en vez de sticky, asi en celular NO tapa -->
<div class="bg-white rounded-[24px] p-5 h-fit lg:sticky lg:top-[72px]">
<h2 class="font-black text-sm" id="formTitle">Agregar empleada</h2>
<div class="grid gap-3 mt-4">
<input id="aNombre" placeholder="Nombre completo *" class="border-2 rounded-full px-4 py-2.5 text-xs">
<input id="aTelefono" placeholder="WhatsApp 3001234567 *" class="border-2 rounded-full px-4 py-2.5 text-xs">
<div class="grid grid-cols-2 gap-2">
<select id="aComuna" class="border-2 rounded-full px-3 py-2.5 text-xs"></select>
<select id="aBarrio" class="border-2 rounded-full px-3 py-2.5 text-xs"><option value="">Barrio *</option></select>
</div>
<input id="aPago" type="number" placeholder="Pago por día" class="border-2 rounded-full px-4 py-2.5 text-xs">
<select id="aEstado" class="border-2 rounded-full px-3 py-2.5 text-xs"><option>Disponible</option><option>Urgente Hoy</option><option>En prueba 3 días</option></select>
<input id="aFotoFile" type="file" accept="image/*" class="text-[11px]">
<div class="flex flex-wrap gap-1" id="skillsBox"></div>
<label class="flex items-center gap-2 text-xs"><input id="aAntecedentes" type="checkbox"> Antecedentes ✅</label>
</div>
<div class="flex gap-2 mt-5">
<button id="btnGuardar" onclick="guardar()" class="flex-1 bg-black text-white rounded-full py-3 text-xs font-bold">Guardar</button>
<button onclick="limpiarForm()" class="border-2 px-5 rounded-full text-xs">Limpiar</button>
</div>
</div>
<div><div class="bg-white rounded-[20px] p-3 flex gap-2 mb-4"><input id="buscAdmin" placeholder="🔍 Buscar..." class="flex-1 border-2 rounded-full px-4 py-2.5 text-xs"><select id="filtroEstadoAdmin" class="border-2 rounded-full px-3 py-2.5 text-xs"><option value="">Todos</option><option value="Disponible">Disponible</option></select></div><div id="listaAdmin" class="grid sm:grid-cols-2 gap-3"></div></div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyBTAApo5GBupOPheePyOo3Qbs-9j4BA7i4",
  authDomain: "empleadas-caseras.firebaseapp.com",
  projectId: "empleadas-caseras",
  storageBucket: "empleadas-caseras.firebasestorage.app",
  messagingSenderId: "125301957543",
  appId: "1:125301957543:web:b20385407f6e3e1b090c82",
  measurementId: "G-3SVEZ7CGBD"
};
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const storage = getStorage(app);
const CLAVE_ADMIN = "admin123";
window.entrar = () => { if(document.getElementById('pass').value === CLAVE_ADMIN){ document.getElementById('login').classList.add('hidden'); document.getElementById('panel').classList.remove('hidden'); iniciar(); } else document.getElementById('errLogin').classList.remove('hidden'); }
const comunasData = {"1":"C1 - Terrón","2":"C2 - Granada","3":"C3 - San Antonio","4":"C4 - Popular","5":"C5 - Chiminangos","6":"C6 - Petecuy","7":"C7 - Alfonso López","8":"C8 - Base Aérea","9":"C9 - Alameda","10":"C10 - Guabal","11":"C11 - Villa del Sur","12":"C12 - Nueva Floresta","13":"C13 - Poblado","14":"C14 - Manuela","15":"C15 - Mojica","16":"C16 - Mariano Ramos","17":"C17 - Pance, Bochalema, Jardín","18":"C18 - Meléndez","19":"C19 - Lido","20":"C20 - Siloé","21":"C21 - Desepaz","22":"C22 - Pance Campestre","correg":"Corregimientos"};
const barriosData={"1":["Terrón Colorado","Vista Hermosa","Aguacatal"],"2":["Granada","Versalles","Chipichape","La Flora"],"3":["San Antonio","El Peñón"],"10":["El Guabal","Panamericano"],"17":["Pance","Bochalema","Ciudad Jardín","El Ingenio","Caney","Valle del Lili"],"19":["El Lido","Tequendama","Miraflores"],"22":["Pance Campestre","Ciudad Campestre"]};
const allSkills=["Bebés 0-2 años","Niños 3-10 años","Adulto Mayor","Mascotas","Cocina Valluna","Plancha Perfecta","Conduce Moto","Aseo Profundo","Interna","Fin de semana"];
let editId=null, cacheAdmin=[];
function iniciar(){
 const sel=document.getElementById('aComuna'); sel.innerHTML='<option value="">Comuna *</option>'+Object.entries(comunasData).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
 sel.onchange=()=>{ const b=document.getElementById('aBarrio'); b.innerHTML='<option value="">Barrio *</option>'; (barriosData[sel.value]||[]).forEach(x=>{let o=document.createElement('option'); o.value=x; o.textContent=x; b.appendChild(o)}); };
 const box=document.getElementById('skillsBox'); box.innerHTML=allSkills.map(s=>`<label class="text-[10px] bg-slate-100 px-2.5 py-1 rounded-full"><input type="checkbox" value="${s}" class="skillChk mr-1">${s}</label>`).join('');
 onSnapshot(query(collection(db,"empleadas_v4"),orderBy("creado","desc")), snap=>{ cacheAdmin=[]; snap.forEach(d=>cacheAdmin.push({id:d.id,...d.data()})); renderAdmin(); });
 document.getElementById('buscAdmin').addEventListener('input',renderAdmin);
 document.getElementById('filtroEstadoAdmin').addEventListener('change',renderAdmin);
}
function renderAdmin(){ let q=document.getElementById('buscAdmin').value.toLowerCase(); let fe=document.getElementById('filtroEstadoAdmin').value; let lista=cacheAdmin.filter(e=> (e.nombre+e.barrio).toLowerCase().includes(q) && (fe?e.estado===fe:true)); document.getElementById('totalAdmin').innerText=cacheAdmin.length; document.getElementById('listaAdmin').innerHTML=lista.map(e=>`<div class="bg-white rounded-[20px] p-4 border"><div class="flex gap-3"><img src="${e.foto||'https://via.placeholder.com/80'}" class="w-14 h-14 rounded-full object-cover"><div class="flex-1"><b class="text-xs">${e.nombre}</b><p class="text-[11px] opacity-60">C${e.comuna} ${e.barrio} • $${Number(e.pago||0).toLocaleString()}</p></div></div><div class="flex gap-2 mt-3"><button onclick="editar('${e.id}')" class="flex-1 bg-black text-white py-2 rounded-full text-[11px]">Editar</button><button onclick="borrar('${e.id}')" class="border px-4 py-2 rounded-full text-[11px]">Borrar</button></div></div>`).join(''); }
window.editar = (id)=>{ let e=cacheAdmin.find(x=>x.id===id); if(!e) return; editId=id; document.getElementById('formTitle').innerText='Editando: '+e.nombre; document.getElementById('aNombre').value=e.nombre||''; document.getElementById('aTelefono').value=e.telefono||''; document.getElementById('aComuna').value=e.comuna||''; document.getElementById('aComuna').onchange(); setTimeout(()=>document.getElementById('aBarrio').value=e.barrio||'',300); document.getElementById('aPago').value=e.pago||''; document.getElementById('aEstado').value=e.estado||'Disponible'; document.getElementById('aAntecedentes').checked=!!e.antecedentes; document.querySelectorAll('.skillChk').forEach(ch=> ch.checked = (e.skills||[]).includes(ch.value)); window.scrollTo({top:0, behavior:'smooth'}); }
window.limpiarForm = ()=>{ editId=null; document.getElementById('formTitle').innerText='Agregar empleada'; ['aNombre','aTelefono','aPago'].forEach(i=>document.getElementById(i).value=''); document.getElementById('aFotoFile').value=''; document.getElementById('aComuna').value=''; document.getElementById('aBarrio').innerHTML='<option value="">Barrio</option>'; document.querySelectorAll('.skillChk').forEach(ch=>ch.checked=false); window.scrollTo({top:0, behavior:'smooth'}); }
// FIX 2: Que no borre la foto si no subes una nueva
window.guardar = async ()=>{
 let nombre=document.getElementById('aNombre').value.trim();
 let telefono=document.getElementById('aTelefono').value.replace(/\D/g,'');
 let comuna=document.getElementById('aComuna').value;
 let barrio=document.getElementById('aBarrio').value;
 if(!nombre ||!telefono ||!comuna ||!barrio){ alert('Falta nombre, teléfono, comuna y barrio'); return; }
 let btn=document.getElementById('btnGuardar'); btn.innerText='Guardando...'; btn.disabled=true;
 let actual = editId? cacheAdmin.find(x=>x.id===editId) : null;
 let fotoUrl = actual?.foto || 'https://via.placeholder.com/400';
 let file=document.getElementById('aFotoFile').files[0];
 if(file){ const r=ref(storage,'empleadas/'+Date.now()+'_'+file.name); await uploadBytes(r,file); fotoUrl=await getDownloadURL(r); }
 let skills=[...document.querySelectorAll('.skillChk:checked')].map(c=>c.value);
 let data={ nombre, telefono, comuna, barrio, pago: Number(document.getElementById('aPago').value||90000), estado: document.getElementById('aEstado').value, foto: fotoUrl, skills, antecedentes: document.getElementById('aAntecedentes').checked, stars: 5 };
 try{ if(editId){ data.creado = actual?.creado || serverTimestamp(); await updateDoc(doc(db,"empleadas_v4",editId), data); } else { data.creado = serverTimestamp(); await addDoc(collection(db,"empleadas_v4"), data); } limpiarForm(); alert('Guardado ✅'); }catch(e){ alert('Error: '+e.message); }
 btn.innerText='Guardar'; btn.disabled=false;
}
window.borrar = async (id)=>{ if(!confirm('¿Borrar?')) return; await deleteDoc(doc(db,"empleadas_v4",id)); }
</script>
</body>
</html>
